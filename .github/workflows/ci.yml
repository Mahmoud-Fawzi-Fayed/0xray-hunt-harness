# CI gates for the harness.
#
# NOTE: GitHub Actions must be enabled + funded on the account to run. If the account's
# Actions billing/spend-limit is off, jobs will NOT start ("startup failure") — that is an
# account setting, not a code failure. So this workflow is MANUAL (workflow_dispatch) and
# never runs on push, which keeps the repo free of spurious red runs.
#
# Run the SAME gates locally (no Actions, no billing):
#     make secret-scan && make skills-lint
# or install them as a git pre-push hook once:
#     make hooks
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic secret scan
        run: make secret-scan

  skills-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint skills
        run: make skills-lint
      - name: skill_map sanity
        run: |
          cd engine/engine
          python3 -c "import skill_map as m; print('class mappings:', len(m.CLASS_SKILL)); assert {'jwt','webhook','api'} <= set(m.CLASS_SKILL), 'new classes missing'"

  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Selfcheck (59 modules)
        run: python3 engine/scripts/selfcheck.py

  e2e:
    runs-on: ubuntu-latest
    needs: selfcheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: E2E integration test
        run: python3 engine/tests/test_e2e_local.py
