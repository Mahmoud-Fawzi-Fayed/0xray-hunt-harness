# Separate hunting n8n — isolated container, network, and volume. Does NOT touch ai-accounting-n8n.
#   up:   docker compose -f docker-compose.hunt-n8n.yml --env-file .env up -d
#   down: docker compose -f docker-compose.hunt-n8n.yml down            (volume persists)
# Own bridge network (NOT host net) so n8n's internal task broker (:5679) can't collide with the
# accounting instance. n8n reaches the host-side hunt-bridge via host.docker.internal.
services:
  hunt-n8n:
    image: n8nio/n8n:latest
    container_name: hunt-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT}:5678"          # UI loopback-only on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach the host bridge
    env_file: .env
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_EDITOR_BASE_URL: http://127.0.0.1:${N8N_PORT}/
      WEBHOOK_URL: http://127.0.0.1:${N8N_PORT}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      HUNT_BRIDGE_URL: ${HUNT_BRIDGE_URL}      # http://host.docker.internal:8899 (see .env)
      HUNT_BRIDGE_TOKEN: ${HUNT_BRIDGE_TOKEN}
    healthcheck:
      # node is always present in the image (busybox wget is not reliable here)
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:5678/healthz\",r=>process.exit(r.statusCode===200?0:1)).on(\"error\",()=>process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    volumes:
      - hunt_n8n_data:/home/node/.n8n
    networks:
      - default

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.89.0/24      # pinned so the ufw allow rule for :8899 is stable
          gateway: 172.31.89.1

volumes:
  hunt_n8n_data:
